name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade Cython==0.29.36 buildozer

    - name: Generate and configure buildozer.spec
      run: |
        buildozer init
        sed -i 's/# title = My Application/title = My Android App/g' buildozer.spec
        sed -i 's/# source.file =/source.file = app_customer_updated.py/g' buildozer.spec
        sed -i 's/# android.api = 33/android.api = 31/g' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/g' buildozer.spec
        sed -i 's/# android.sdk = 20/android.sdk = 31/g' buildozer.spec

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
